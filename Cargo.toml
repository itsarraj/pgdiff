[package]
name = "pgdiff"
version = "0.1.0"
edition = "2021"
description = "Compares two live Postgres schemas and generates the SQL to reconcile them"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/pgdiff"
readme = "README.md"
keywords = ["postgres", "schema", "migration", "diff", "migra"]
categories = ["command-line-utilities", "database"]

[lib]
name = "pgdiff"
path = "src/lib.rs"

[[bin]]
name = "pgdiff"
path = "src/main.rs"

[dependencies]
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
